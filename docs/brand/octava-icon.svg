<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Ícono de Octava (versión a sangre). Dos anillos forman un 8: dos notas a una octava;
       la aguda vibra al doble, por eso mide la mitad. El anillo inferior con punto evoca un vinilo/parlante. -->
  <rect width="1024" height="1024" rx="230" fill="#15171C"/>
  <circle cx="512" cy="600" r="168" fill="none" stroke="#FF8A4C" stroke-width="64"/>
  <circle cx="512" cy="600" r="36" fill="#FF8A4C"/>
  <circle cx="512" cy="332" r="68" fill="none" stroke="#FFC09A" stroke-width="64"/>
</svg>
